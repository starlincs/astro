[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astro-pipeline"
dynamic = ["version"]
description = "CLI tool and library for CSV import pipelines"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Tom" }]
maintainers = [{ name = "Tom" }]
keywords = ["etl", "csv", "pipeline", "polars", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Archiving",
    "Typing :: Typed",
]
dependencies = [
    "polars>=1.0",
    "pyarrow>=16.0",
    "pydantic>=2.0",
    "pandera>=0.20",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0",
    "pytest-cov>=6.0",
    "pytest>=8.0",
    "ruff>=0.4",
    "ty>=0.0.75,<0.1",
    "hypothesis>=6.0",
    "build>=1.0",
    "twine>=6.0",
]
docs = [
    "sphinx>=8.0",
    "myst-parser>=4.0",
    "furo>=2024.0",
    "sphinx-autobuild>=2024.0",
]

[project.urls]
Homepage = "https://github.com/starlincs/astro"
Documentation = "https://astro-pipeline.readthedocs.io"
Repository = "https://github.com/starlincs/astro"
Issues = "https://github.com/starlincs/astro/issues"
Changelog = "https://github.com/starlincs/astro/blob/main/CHANGELOG.md"
Download = "https://pypi.org/project/astro-pipeline/"

[project.scripts]
astro = "astro.cli.main:app"

[tool.hatch.version]
path = "src/astro/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/astro"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "RUF012", "D101"]
"examples/**" = ["RUF012"]
"src/astro/cli/display/flow.py" = ["D101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=astro --cov-report=term-missing --cov-fail-under=80 -m \"not large\""
markers = [
    "integration: tests needing external fixtures or full pipeline dirs",
    "large: optional large-file streaming integration tests",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["astro"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ty.src]
include = ["src/astro"]
